services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234567
      MYSQL_DATABASE: crud
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./tarjetas-backend
    container_name: nest_app
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: 1234567
      DB_NAME: crud
    depends_on:
      - db
    ports:
      - "3000:3000"

  frontend:
    build: ./tarjetas-frontend
    container_name: angular_app
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data: