<div class="container my-4">
  <h2 class="mb-3">CRUD de Tarjetas</h2>

  
  <form (submit)="save()" class="mb-4">
    <div class="mb-3">
      <input [(ngModel)]="form.title" name="title" class="form-control" placeholder="Título" required>
    </div>
    <div class="mb-3">
      <textarea [(ngModel)]="form.description" name="description" class="form-control" placeholder="Descripción" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Crear</button>
  </form>

  <div class="row">
    <div class="col-12 col-md-4" *ngFor="let tarjeta of tarjetas">
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title">{{ tarjeta.title }}</h5>
          <p class="card-text">{{ tarjeta.description }}</p>
          <button class="btn btn-warning btn-sm me-2" (click)="edit(tarjeta)">Editar</button>
          <button class="btn btn-danger btn-sm" (click)="delete(tarjeta.id)">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Tarjeta</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <input [(ngModel)]="form.title" name="editTitle" class="form-control mb-2" placeholder="Título">
          <textarea [(ngModel)]="form.description" name="editDescription" class="form-control" placeholder="Descripción"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" (click)="save()" data-bs-dismiss="modal">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>
</div>
